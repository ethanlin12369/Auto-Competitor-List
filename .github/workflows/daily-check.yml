name: Daily competitor check
on:
  schedule:
    - cron: "0 6 * * *"    # 06:00 UTC daily (~08:00 Berlin summer time)
  workflow_dispatch:        # allows manual "Run workflow" button

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser + dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Check competitor websites
        run: python check_competitors.py

      - name: Save results to the repository
        run: |
          git config user.name "competitor-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Daily check: $(date -u +%Y-%m-%d)" || echo "Nothing to commit"
          git push
